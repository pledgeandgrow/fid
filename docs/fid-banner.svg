<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Fid — a systems language that checks what it promises</title>
  <desc id="desc">A dark GitHub banner with the Fid logo, a concise language tagline, and a small syntax-highlighted Fid program in a terminal-style panel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06070b"/>
      <stop offset="0.52" stop-color="#0d1018"/>
      <stop offset="1" stop-color="#1a0f1b"/>
    </linearGradient>
    <radialGradient id="crimsonGlow" cx="78%" cy="32%" r="62%">
      <stop offset="0" stop-color="#c2255c" stop-opacity="0.38"/>
      <stop offset="0.42" stop-color="#c2255c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c2255c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6f9f"/>
      <stop offset="0.52" stop-color="#c2255c"/>
      <stop offset="1" stop-color="#6d1e42"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.48" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#c2255c" stop-opacity="0.38"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 H 0 V 34" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <filter id="logoGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#c2255c" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <clipPath id="terminalClip">
      <rect x="910" y="78" width="610" height="344" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <rect width="1600" height="500" fill="url(#crimsonGlow)"/>
  <path d="M 742 0 H 1600 V 500 H 1044 Z" fill="#ffffff" opacity="0.018"/>
  <path d="M 790 500 L 1600 0" stroke="url(#accent)" stroke-width="2" opacity="0.34"/>
  <path d="M 835 500 L 1600 45" stroke="#ffffff" stroke-width="1" opacity="0.07"/>
  <path d="M 748 500 L 1600 118" stroke="#ffffff" stroke-width="1" opacity="0.045"/>
  <rect x="1040" y="0" width="560" height="500" fill="url(#dots)" opacity="0.42"/>

  <g transform="translate(1028 -138) scale(0.76)" fill="#ffffff" opacity="0.034">
    <path d="M 327 857 L 327 511 C 327 430 343 361 380 314 C 410 276 451 256 478 248 C 448 274 438 307 438 355 L 438 694 C 438 733 429 755 410 778 Z M 327 401 L 327 312 C 327 272 342 239 371 211 C 401 181 437 172 474 172 L 806 172 L 720 258 L 462 258 C 421 258 389 270 366 293 C 344 315 332 351 327 401 Z"/>
    <path d="M 444 523 L 528 437 L 728 437 L 642 523 Z"/>
  </g>

  <g transform="translate(84 118) scale(0.17578125)" filter="url(#logoGlow)">
    <rect width="1024" height="1024" rx="120" fill="#030407" stroke="#4b4c58" stroke-width="18"/>
    <path fill="#ffffff" d="M 327 857 L 327 511 C 327 430 343 361 380 314 C 410 276 451 256 478 248 C 448 274 438 307 438 355 L 438 694 C 438 733 429 755 410 778 Z M 327 401 L 327 312 C 327 272 342 239 371 211 C 401 181 437 172 474 172 L 806 172 L 720 258 L 462 258 C 421 258 389 270 366 293 C 344 315 332 351 327 401 Z"/>
    <path fill="#ffffff" d="M 444 523 L 528 437 L 728 437 L 642 523 Z"/>
  </g>

  <text x="314" y="106" fill="#ff6f9f" font-family="Consolas, 'Cascadia Mono', monospace" font-size="15" font-weight="700" letter-spacing="4.2">SELF-HOSTED SYSTEMS LANGUAGE</text>
  <rect x="314" y="122" width="88" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="310" y="207" fill="#f5f7fb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="94" font-weight="800" letter-spacing="-3">Fid</text>
  <text x="314" y="254" fill="#e8edf7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="650">A systems language that checks</text>
  <text x="314" y="294" fill="#e8edf7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="650">what it promises.</text>
  <text x="314" y="333" fill="#9aa5ba" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Borrow checking · capability grants · effect tracking · native executables</text>

  <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="14" font-weight="700" letter-spacing="0.7">
    <rect x="314" y="362" width="118" height="42" rx="21" fill="#121722" stroke="#343947"/>
    <text x="373" y="389" text-anchor="middle" fill="#c8d0df">ownership</text>
    <rect x="446" y="362" width="94" height="42" rx="21" fill="#121722" stroke="#343947"/>
    <text x="493" y="389" text-anchor="middle" fill="#c8d0df">effects</text>
    <rect x="554" y="362" width="124" height="42" rx="21" fill="#121722" stroke="#343947"/>
    <text x="616" y="389" text-anchor="middle" fill="#c8d0df">capabilities</text>
    <rect x="692" y="362" width="86" height="42" rx="21" fill="#121722" stroke="#343947"/>
    <text x="735" y="389" text-anchor="middle" fill="#c8d0df">native</text>
    <rect x="792" y="362" width="88" height="42" rx="21" fill="#211520" stroke="#69304b"/>
    <text x="836" y="389" text-anchor="middle" fill="#ff8fb4">no GC</text>
  </g>

  <text x="314" y="455" fill="#687389" font-family="Consolas, 'Cascadia Mono', monospace" font-size="15">compiler written in Fid · byte-identical fixpoint · no LLVM</text>

  <g filter="url(#cardShadow)">
    <rect x="910" y="78" width="610" height="344" rx="24" fill="#0a0d14" stroke="url(#cardEdge)" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#terminalClip)">
    <rect x="910" y="78" width="610" height="52" fill="#121722"/>
    <path d="M 910 130 H 1520" stroke="#ffffff" stroke-opacity="0.07"/>
    <circle cx="1482" cy="78" r="190" fill="#c2255c" opacity="0.08"/>
    <circle cx="1514" cy="130" r="96" fill="#ff6f9f" opacity="0.045"/>
    <path d="M 910 392 H 1520" stroke="#ffffff" stroke-opacity="0.055"/>
  </g>

  <circle cx="944" cy="104" r="6" fill="#ff5f57"/>
  <circle cx="966" cy="104" r="6" fill="#febc2e"/>
  <circle cx="988" cy="104" r="6" fill="#28c840"/>
  <text x="1020" y="110" fill="#828da3" font-family="Consolas, 'Cascadia Mono', monospace" font-size="14">hello.fd</text>

  <g font-family="Consolas, 'Cascadia Mono', 'JetBrains Mono', monospace" font-size="19" xml:space="preserve">
    <text x="948" y="158"><tspan fill="#ff6f9f">fn</tspan><tspan fill="#e8edf7"> main() {</tspan></text>
    <text x="976" y="182"><tspan fill="#ff6f9f">val</tspan><tspan fill="#e8edf7"> name = </tspan><tspan fill="#e5c07b">"world"</tspan><tspan fill="#e8edf7">;</tspan></text>
    <text x="976" y="206"><tspan fill="#ff6f9f">var</tspan><tspan fill="#e8edf7"> total = </tspan><tspan fill="#d19a66">0</tspan><tspan fill="#e8edf7">;</tspan></text>
    <text x="976" y="230"><tspan fill="#ff6f9f">for</tspan><tspan fill="#e8edf7"> i </tspan><tspan fill="#ff6f9f">in</tspan><tspan fill="#e8edf7"> </tspan><tspan fill="#d19a66">1</tspan><tspan fill="#e8edf7">..=</tspan><tspan fill="#d19a66">100</tspan><tspan fill="#e8edf7"> {</tspan></text>
    <text x="1004" y="254"><tspan fill="#e8edf7">total += i;</tspan></text>
    <text x="976" y="278"><tspan fill="#e8edf7">}</tspan></text>
    <text x="976" y="302"><tspan fill="#e8edf7">println(</tspan><tspan fill="#61afef">f</tspan><tspan fill="#e5c07b">"Hello, {name}!"</tspan><tspan fill="#e8edf7">);</tspan></text>
    <text x="948" y="326"><tspan fill="#e8edf7">}</tspan></text>
    <text x="948" y="366"><tspan fill="#ff6f9f">$</tspan><tspan fill="#c8d0df"> fid run hello.fd</tspan></text>
    <text x="948" y="394"><tspan fill="#7ee787">Hello, world!</tspan></text>
  </g>

  <rect x="0" y="0" width="1600" height="500" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
</svg>
