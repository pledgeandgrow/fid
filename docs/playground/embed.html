<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fides Playground Embed</title>
<!--
  An embeddable Fides playground for an <iframe> (roadmap L10D): one
  playground filling the frame. The code comes from the address:
    embed.html#<base64 of encodeURIComponent(code)>   the full playground's
                                                     share-link form
    embed.html?code=<URL-encoded code>
  and the options from the query: mode, modes, autorun, stdin (as the
  data- attributes of embed.js). With neither, a hello world.
  Served next to fidesc.wasm and stdlib.json (data-assets="./").
-->
<style>
  :root { --page-bg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page-bg: #171a21; } }
  :root[data-theme="dark"] { --page-bg: #171a21; }
  html, body { margin: 0; height: 100%; background: var(--page-bg); }
  #pg { height: 100%; }
  #pg .fpe { margin: 0; height: 100%; display: flex; flex-direction: column; border-radius: 0; border: 0; }
  #pg .fpe-code { flex: 1 1 60%; resize: none; }
  #pg .fpe-out { flex: 0 1 auto; max-height: 45%; }
</style>
</head>
<body>
<div id="pg"></div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var code = null;
    if (location.hash.length > 1) {
      try { code = decodeURIComponent(atob(location.hash.slice(1))); } catch (e) { code = null; }
    }
    if (code == null && q.has('code')) code = q.get('code');
    if (code == null) code = 'fn main() {\n    println("Hello from an embedded Fides playground");\n}\n';
    var host = document.getElementById('pg');
    host.className = 'fides-playground';
    host.textContent = code;
    ['mode', 'modes', 'stdin'].forEach(function (k) { if (q.has(k)) host.setAttribute('data-' + k, q.get(k)); });
    if (q.has('autorun')) host.setAttribute('data-autorun', '');
    if (q.has('theme')) document.documentElement.setAttribute('data-theme', q.get('theme'));
  })();
</script>
<script src="embed.js" data-assets="./"></script>
</body>
</html>
