[package]
name = "fidesc"
version = "0.1.0"
edition = "2021"
description = "Bootstrap compiler for the Fides programming language"
license = "MIT"

[[bin]]
name = "fidesc"
path = "src/main.rs"

[dependencies]
hashbrown = "0.15"
compact_str = "0.8"
smallvec = "1.13"
bumpalo = "3.16"

[profile.release]
opt-level = 2
