[package]
name = "fidesc"
version = "0.1.0"
edition = "2021"
description = "Bootstrap compiler for the Fides programming language"
license = "MIT"

[lib]
name = "fidesc"
path = "src/lib.rs"

[[bin]]
name = "fidesc"
path = "src/main.rs"

[[bin]]
name = "pacte"
path = "src/bin/pacte.rs"

[[bin]]
name = "scribe"
path = "src/bin/scribe.rs"

[[bin]]
name = "veil"
path = "src/bin/veil.rs"

[dependencies]
hashbrown = "0.15"
compact_str = "0.8"
smallvec = "1.13"
bumpalo = "3.16"
libc = "0.2"

[profile.release]
opt-level = 2
