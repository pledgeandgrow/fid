name: Bug report
description: The compiler rejects a valid program, accepts an invalid one, crashes, or a program behaves wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security problems** (a safety check that can be bypassed, memory corruption from safe code) go through the private channel in [SECURITY.md](https://github.com/pledgeandgrow/fid/blob/main/SECURITY.md), not here.
        Known open bugs are listed in `docs/reference/known-bugs.md` (§2g).
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `fid version`, and the commit if you built from source.
      placeholder: "fid 0.1.0, commit 3215fe7"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Where it happens
      multiple: true
      options:
        - Interpreter (fid run)
        - C (fid ccompile)
        - Native Windows (fid emit / fid build)
        - Native Linux (fid emit --target ...)
        - Type checker / other checks (fid check)
        - Tools (fmt, lsp, doc, veil, ark, ...)
        - Installer
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, Linux, macOS, Other]
  - type: textarea
    id: program
    attributes:
      label: Smallest program that shows it
      description: A short `.fd` file, as small as you can make it.
      render: rust
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command you ran and what it printed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
