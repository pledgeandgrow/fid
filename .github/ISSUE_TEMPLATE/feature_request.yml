name: Feature or language proposal
description: A new language feature, library module or tool.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Larger language changes go through a proposal (`docs/proposals/0000-template.md`); this form is a good place to start the discussion. Open questions are also welcome in [Discussions](https://github.com/pledgeandgrow/fid/discussions).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do, or what is painful today? A short example helps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: Syntax or API sketch, and how it interacts with ownership, effects and the safety annotations.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and other languages
      description: How Rust, Zig, Go, C or others solve it, and workarounds in Fides today.
