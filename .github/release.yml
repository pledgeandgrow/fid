# Groups GitHub's generated release notes by pull-request label.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security
      labels: [security]
    - title: Language
      labels: [language]
    - title: Compiler and back ends
      labels: [compiler, backend]
    - title: Standard library
      labels: [stdlib]
    - title: Tools and docs
      labels: [tooling, docs]
    - title: Bug fixes
      labels: [bug]
    - title: Other changes
      labels: ["*"]
