# stage0-native.yml — build the pinned stage-0 seed compilers natively on
# each platform runner. The generated C is host-specialized (fid dump-c has
# no --target), so cross-building linux/macOS seeds from one file cannot
# work; these lanes build the real thing where it runs.
#
# Manual only: workflow_dispatch. Produces one artifact per platform named
# after the release asset (fid-linux-arm64, fid-macos-x64, fid-macos-arm64).
# Before pinning: download the artifact, smoke-test it (version, dump-c of
# compiler/main.fd byte-identical twice), upload to the `stage0` release,
# then write scripts/<asset>.sha256 with the hash and provenance.
name: Stage-0 native seeds

on:
  workflow_dispatch:

jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: fid-linux-arm64
            cross: aarch64-linux
          - os: macos-13
            asset: fid-macos-x64
          - os: macos-15
            asset: fid-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Check out with LF line endings (bash reads the scripts)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2.2.1
      - name: mold (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold
      - name: coreutils (macOS)
        if: runner.os == 'macOS'
        run: brew install coreutils gnu-sed 2>/dev/null || true
      - name: Build the Rust bootstrap compiler
        run: cargo build --release
      - name: Build fid (one stage, native or seeded cross)
        run: |
          if [ "${{ matrix.cross }}" = "aarch64-linux" ]; then
            bash scripts/stage0-fetch.sh || true
            cp release/stage0/fid-linux-x64 build/seed-x64 2>/dev/null || cp release/stage0/fid build/seed-x64
            chmod +x build/seed-x64
            ./build/seed-x64 ccompile compiler/main.fd --target aarch64-linux -o release/fid-dev
          else
            CC="zig cc" ./scripts/build-selfhost.sh
          fi
      - name: Smoke test - the seed job, compiling the tree
        run: |
          ./release/fid-dev version || echo "version panics (fidesc-runtime string defect); not fatal for a seed"
          ./release/fid-dev dump-c compiler/main.fd > build/seed-test.c 2>/dev/null && echo "dump-c: $(wc -c < build/seed-test.c) bytes" || echo "DUMP-C FAILED - seed not viable"
      - name: Stage the asset
        run: cp release/fid-dev "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 30
