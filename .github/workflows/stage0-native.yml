# stage0-native.yml — build the pinned stage-0 seed compilers for the
# platforms that have none, by SEEDED CROSS-COMPILATION: ccompile --target
# re-resolves @cfg for the target OS (compiler/main.fd sets g_cfg_os /
# g_cfg_arch), so the pinned linux-x64 seed cross-builds correct
# per-platform binaries — no per-platform runner, no fidesc (whose runtime
# defects make its binaries unable to compile the tree, verified Nov 27:
# a fidesc-built fid fails dump-c on macOS and linux-arm64 alike).
#
# Manual only: workflow_dispatch. Produces one artifact per platform named
# after the release asset (fid-linux-arm64, fid-macos-x64, fid-macos-arm64).
# Before pinning: download the artifact, upload to the `stage0` release,
# then write scripts/<asset>.sha256 with the hash and provenance.
name: Stage-0 native seeds

on:
  workflow_dispatch:

jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: fid-linux-arm64
            target: aarch64-linux
            emu: qemu
          - asset: fid-macos-x64
            target: x86_64-macos
            emu: none
          - asset: fid-macos-arm64
            target: aarch64-macos
            emu: none
          - asset: fid.exe
            target: x86_64-windows
            emu: none
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out with LF line endings (bash reads the scripts)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: qemu for the linux-arm64 smoke test
        if: matrix.emu == 'qemu'
        # ubuntu-26.04: qemu-user-static is a virtual name qemu-user-binfmt
        # provides, and the emulators lost the -static suffix
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-binfmt || sudo apt-get install -y -qq qemu-user-static || sudo apt-get install -y -qq qemu-user
          QA=$(command -v qemu-aarch64-static || command -v qemu-aarch64) || { echo "no qemu-aarch64"; exit 1; }
          echo "QA=$QA" >> "$GITHUB_ENV"
      - name: Fetch the pinned linux-x64 seed
        run: |
          mkdir -p build release
          bash scripts/stage0-fetch.sh
          cp release/stage0/fid-linux-x64 build/seed-x64
          chmod +x build/seed-x64
          ./build/seed-x64 version
      - name: Cross-compile fid for ${{ matrix.target }}
        run: |
          # zig shim: the pinned seed emits time.h deep in the runtime, after
          # user extern calls (fixed in the tree, but the seed is frozen);
          # linux headers tolerate it, macOS errors. Force-include time.h in
          # every compile (-c); link commands pass through untouched.
          mkdir -p build/shim
          ZIGBIN=$(command -v zig)
          {
            echo '#!/bin/bash'
            echo 'case " $* " in'
            echo '  *" -c "*) exec ZZ "$@" -include time.h ;;'
            echo '  *) exec ZZ "$@" ;;'
            echo 'esac'
          } > build/shim/zig
          sed -i "s|ZZ|$ZIGBIN|g" build/shim/zig
          chmod +x build/shim/zig
          ZIG="$PWD/build/shim/zig"
          # [1/4] emit C for the target (@cfg re-resolves per --target)
          ./build/seed-x64 dump-c compiler/main.fd --target ${{ matrix.target }} > build/fid-raw.c 2> build/dumpc.log || {
            echo "dump-c failed:"; tail -30 build/dumpc.log; exit 1; }
          echo "dump-c: $(wc -c < build/fid-raw.c) bytes"
          # [2/4] wrap main on a 256MB-stack thread: the typechecker's
          # recursion overflows the 8MB default stack on the big tree
          # (tier1 macOS Nov 27: "Panic: Stack overflow" in the typechecker).
          sed 's/^int main(int argc, char\*\* argv)/int fides_main(int argc, char** argv)/' build/fid-raw.c > build/fid-wrapped.c
          grep -c "^int fides_main" build/fid-wrapped.c
          cat scripts/stackwrap.c >> build/fid-wrapped.c
          # [3/4] split into 16 units, compile at -O2 (retry alone at -O0)
          ./build/seed-x64 split-c build/fid-wrapped.c build/fidu 16
          case "${{ matrix.target }}" in
            aarch64-linux)  TRIP=aarch64-linux-musl;  LIBS="-lm -lpthread -ldl -lunwind" ;;
            x86_64-macos)   TRIP=x86_64-macos;        LIBS="-lm -lpthread" ;;
            aarch64-macos)  TRIP=aarch64-macos;       LIBS="-lm -lpthread" ;;
            x86_64-windows) TRIP=x86_64-windows-gnu;  LIBS="-lws2_32" ;;
          esac
          echo "triple: $TRIP libs: $LIBS"
          : > build/cc.log
          compile_one() {
            u="$1"
            "$ZIG" cc -target "$TRIP" -O2 -fno-strict-aliasing -fwrapv -c "$u" -o "${u%.c}.o" 2>> build/cc.log \
              || "$ZIG" cc -target "$TRIP" -O0 -fno-strict-aliasing -fwrapv -fno-sanitize=all -c "$u" -o "${u%.c}.o" 2>> build/cc.log
          }
          export -f compile_one; export ZIG TRIP
          ls build/fidu_*.c | xargs -P 2 -I{} bash -c 'compile_one "$@"' _ {} || { echo "unit compile failed:"; tail -20 build/cc.log; exit 1; }
          ls build/fidu_*.o | wc -l
          # [4/4] link
          "$ZIG" cc -target "$TRIP" -O2 -o release/fid-dev build/fidu_*.o $LIBS 2>> build/cc.log || { echo "link failed:"; tail -20 build/cc.log; exit 1; }
          ls -la release/fid-dev
      - name: Smoke test (qemu - real execution)
        if: matrix.emu == 'qemu'
        run: |
          "$QA" ./release/fid-dev version
          "$QA" ./release/fid-dev ccompile tests/bootstrap/hello.fd --target aarch64-linux -o build/hello-arm64
          "$QA" ./build/hello-arm64 | grep -q . && echo "smoke: hello runs"
      - name: Smoke test (macOS - format check; execution happens in CI)
        if: matrix.emu == 'none'
        run: |
          magic=$(xxd -p -l 4 release/fid-dev)
          echo "magic: $magic"
          # Mach-O 64-bit little-endian: cf fa ed fe; PE32+: MZ (4d5a)
          case "${{ matrix.target }}" in
            *windows*) [ "${magic:0:4}" = "4d5a" ] || { echo "NOT A PE BINARY"; exit 1; } ;;
            *)         [ "$magic" = "cffaedfe" ] || { echo "NOT A MACH-O BINARY"; exit 1; } ;;
          esac
          size=$(stat -c %s release/fid-dev)
          echo "size: $size"
          [ "$size" -gt 10000000 ] || { echo "SUSPICIOUSLY SMALL"; exit 1; }
      - name: Stage the asset
        run: cp release/fid-dev "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 30
