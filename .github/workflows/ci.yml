# CI: every push and pull request to main.
#
# Windows runs the whole suite on all three backends (interpreter, C, native
# PE) and proves the self-hosted compiler reproduces itself byte for byte.
# Linux runs the suite through the interpreter and C, bootstraps `fid`, and
# installs a release archive on a clean machine (`fid` has no native Linux
# path yet, so `emit` output is checked but not run).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CC: zig cc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release --lib

      # Every C test failed under MinGW gcc on the first runs: this shows why,
      # without holding up the rest.
      - name: C path with gcc (diagnostic)
        continue-on-error: true
        shell: bash
        env:
          CC: gcc
        run: |
          ./target/release/fidesc.exe ccompile tests/bootstrap/hello.fd -o hello-gcc.exe
          ./hello-gcc.exe

      - name: Test suite (interpreter, C, native)
        shell: bash
        run: ./target/release/fidesc.exe test --jobs 4

      - name: Programs that must be rejected
        shell: bash
        run: ./target/release/fidesc.exe test --fail

      - name: Every stdlib module compiles
        shell: bash
        run: bash scripts/check-stdlib.sh ./target/release/fidesc.exe

      - name: Native fixpoint
        shell: bash
        run: |
          ./target/release/fidesc.exe emit compiler/main.fd -o n1.exe --no-cache
          ./n1.exe emit compiler/main.fd -o n2.exe --no-cache
          ./n2.exe emit compiler/main.fd -o n3.exe --no-cache
          cmp n2.exe n3.exe

      - name: fid works from an installed location
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fides/bin"
          cp n3.exe "$RUNNER_TEMP/fides/bin/fid.exe"
          cp -r stdlib "$RUNNER_TEMP/fides/"
          cp tests/bootstrap/hello.fd "$RUNNER_TEMP/hello.fd"
          cd "$RUNNER_TEMP"
          ./fides/bin/fid.exe emit hello.fd -o hello.exe --no-cache
          ./hello.exe

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CC: gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install the linker
        run: sudo apt-get install -y mold

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release --lib

      - name: Test suite (interpreter, C)
        run: ./target/release/fidesc test --jobs 4

      - name: Programs that must be rejected
        run: ./target/release/fidesc test --fail

      - name: Bootstrap fid on Linux
        run: RELEASE=1 ./scripts/bootstrap.sh

      - name: Package a release archive
        run: |
          mkdir -p dist/fides/bin
          cp release/fid dist/fides/bin/
          cp -r stdlib dist/fides/
          tar -czf dist/fides-linux-x64.tar.gz -C dist fides

      - name: Install on a clean machine
        run: |
          cp tests/bootstrap/hello.fd dist/hello.fd
          docker run --rm -v "$PWD/dist:/work" -w /work ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq gcc > /dev/null
            mkdir /opt/fides
            tar -xzf fides-linux-x64.tar.gz -C /opt
            /opt/fides/bin/fid run hello.fd
            CC=gcc /opt/fides/bin/fid ccompile hello.fd -o /tmp/hello
            /tmp/hello
          '
