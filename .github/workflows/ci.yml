# Quick checks on every push and pull request to main.
#
#   rust      the frozen Rust bootstrap compiler (src/) builds and its unit
#             tests pass, on Linux and Windows; it runs hello.fd.
#   selfhost  the self-hosted compiler fid is built from compiler/*.fd in one
#             stage (scripts/build-selfhost.sh) and runs and compiles a few
#             programs, and the leak gate passes.
#   natgate   the own-backend gate (scripts/nat-gate.sh) on x86_64-linux:
#             the IR verifier and the allocation checker on every emit.
#
# The full suite, the 3-stage fixpoint and the cross targets take hours and
# run before a release (docs/reference/releasing.md, scripts/ci/cross.yml).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: mold (the Linux linker .cargo/config.toml asks for)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold
      - name: Build
        run: cargo build --release
      - name: Unit tests
        run: cargo test --release --lib
      - name: hello.fd through the interpreter
        shell: bash
        run: ./target/release/fidesc run tests/bootstrap/hello.fd

  selfhost:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: mold
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold
      - name: Build the Rust bootstrap compiler
        run: cargo build --release
      - name: Build fid (one stage)
        env:
          CC: zig cc
        run: ./scripts/build-selfhost.sh
      - name: fid run / ccompile
        env:
          CC: zig cc
        run: |
          ./release/fid-dev run tests/bootstrap/hello.fd
          ./release/fid-dev ccompile tests/bootstrap/test_vec_filled.fd -o vf
          ./vf
      - name: Leak gate (tests/leaks)
        env:
          CC: zig cc
        run: bash scripts/leak-check.sh release/fid-dev
      - name: Doc examples (CU7)
        run: python3 scripts/doctest.py stdlib --fid ./release/fid-dev

  natgate:
    # The own-backend gate (docs/roadmap/llvm-roadmap.md RL7): the IR
    # verifier and the register-allocation checker on every emit, the rules
    # tested and proved. x86_64-linux runs natively on ubuntu-latest; the
    # qemu targets run with the release cross builds (scripts/ci/cross.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: mold
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mold
      - name: Build the Rust bootstrap compiler
        run: cargo build --release
      - name: Build fid (one stage)
        env:
          CC: zig cc
        run: ./scripts/build-selfhost.sh
      - name: nat-gate on x86_64-linux
        env:
          CC: zig cc
          FID: release/fid-dev
        run: bash scripts/nat-gate.sh x86_64-linux
