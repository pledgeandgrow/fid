name: Build Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Tags are v1.2.3; the installer file name and VIProductVersion
            # want 1.2.3 — strip the leading v.
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Fides toolchain
        shell: bash
        run: |
          cargo build --release
          # Stage the binaries where fides.nsi expects them. fides.exe is the
          # bootstrap compiler under the name the installer has always used;
          # fidesc.exe is the same binary under its canonical name, alongside
          # the companion tools.
          mkdir -p release
          cp target/release/fidesc.exe release/fides-c3.exe
          cp target/release/fidesc.exe release/fidesc.exe
          cp target/release/ark.exe    release/ark.exe
          cp target/release/scribe.exe release/scribe.exe
          cp target/release/veil.exe   release/veil.exe

      - name: Verify build
        shell: bash
        run: |
          ./release/fidesc.exe version
          ./release/fidesc.exe run tests/bootstrap/hello.fd
          ./release/ark.exe --help >/dev/null 2>&1 || ./release/ark.exe >/dev/null 2>&1 || true

      - name: Install NSIS
        shell: bash
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH
          echo "C:\Program Files (x86)\NSIS\Bin" >> $GITHUB_PATH

      - name: Build installer
        shell: pwsh
        run: |
          cd installer
          $version = "${{ steps.version.outputs.version }}"
          # Update version in the NSIS script
          (Get-Content fides.nsi) -replace '!define VERSION "1.0.0"', "!define VERSION `"$version`"" | Set-Content fides.nsi
          makensis fides.nsi
          Rename-Item "Fides-Setup-1.0.0.exe" "Fides-Setup-$version.exe" -ErrorAction SilentlyContinue

      - name: Upload installer to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Fides-Setup-*.exe

      - name: Upload installer as artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Fides-Setup-${{ steps.version.outputs.version }}
          path: installer/Fides-Setup-*.exe
