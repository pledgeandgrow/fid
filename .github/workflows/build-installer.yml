name: Build Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Fides compiler
        shell: bash
        run: |
          cargo build --release
          # The Rust bootstrap compiler (fidesc) is the shipped binary.
          # It has the same functionality as the self-hosted compiler.
          cp target/release/fidesc.exe target/release/fides.exe

      - name: Verify build
        shell: bash
        continue-on-error: true
        run: |
          ./target/release/fides.exe run tests/bootstrap/hello.fd

      - name: Install NSIS
        shell: bash
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH
          echo "C:\Program Files (x86)\NSIS\Bin" >> $GITHUB_PATH

      - name: Build installer
        shell: pwsh
        run: |
          # Copy the compiler binary to the location the NSIS script expects
          New-Item -ItemType Directory -Force -Path release
          Copy-Item target/release/fides.exe release/fides-c3.exe

          cd installer
          $version = "${{ steps.version.outputs.version }}"
          # Update version in the NSIS script
          (Get-Content fides.nsi) -replace '!define VERSION "1.0.0"', "!define VERSION `"$version`"" | Set-Content fides.nsi
          makensis fides.nsi
          Rename-Item "Fides-Setup-1.0.0.exe" "Fides-Setup-$version.exe" -ErrorAction SilentlyContinue

      - name: Upload installer to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: installer/Fides-Setup-*.exe

      - name: Upload installer as artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Fides-Setup-${{ steps.version.outputs.version }}
          path: installer/Fides-Setup-*.exe
