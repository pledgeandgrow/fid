id = "fides"
name = "Fides"
description = "Fides (.fd): Tree-sitter highlighting, outline and brackets, and the fid language server (`fid lsp`)."
version = "0.1.0"
schema_version = 1
authors = ["Pledge and Grow"]
repository = "https://github.com/pledgeandgrow/fid"

# The grammar is editors/tree-sitter-fides of this repository. Zed builds it
