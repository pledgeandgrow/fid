id = "fides"
name = "Fides"
description = "Fides (.fd): Tree-sitter highlighting, outline and brackets, and the fid language server (`fid lsp`)."
version = "0.1.0"
schema_version = 1
authors = ["Pledge and Grow"]
repository = "https://github.com/pledgeandgrow/fid"

# The grammar is editors/tree-sitter-fides of this repository. Zed builds it
# from its generated src/parser.c, so that directory must hold the output of
# `tree-sitter generate` (editors/README.md, "Zed"). Pin `rev` to the commit
# that holds it before publishing the extension; "main" follows the branch.
[grammars.fides]
repository = "https://github.com/pledgeandgrow/fid"
rev = "main"
path = "editors/tree-sitter-fides"

[language_servers.fid]
name = "fid"
languages = ["Fides"]
