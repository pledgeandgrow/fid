# Fides in Helix: append to ~/.config/helix/languages.toml
[language-server.fid]
command = "fid"
args = ["lsp"]

[[language]]
name = "fides"
scope = "source.fides"
file-types = ["fd"]
roots = ["ark.toml", ".git"]
comment-token = "//"
indent = { tab-width = 4, unit = "    " }
language-servers = ["fid"]
